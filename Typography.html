<!DOCTYPE html>
<html>
<head>
    <title>CSS Typography</title>

    <style>
        h1 {
            font-family: Arial;
            font-size: 40px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px gray;
        }

        p {
            font-family: Georgia;
            font-size: 20px;
            line-height: 1.5;
            word-spacing: 5px;
            text-indent: 40px;
        }
    </style>
</head>

<body>

    <h1>Typography</h1>

    <p>
        Typography is used to make text beautiful, readable,
        and attractive on a webpage.
    </p>

</body>
</html>
