<!DOCTYPE html>
<html>
<head>
    <title>Kachori Circle</title>

    <style>
        .circle {
            width: 250px;
            height: 250px;
            border: 5px solid red;
            background-color: yellow;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
            font-weight: bold;
        }

        .green {
            color: green;
        }

        .red {
            color: red;
        }
    </style>
</head>

<body>

    <div class="circle">
        <span class="green">K</span><span class="red">achori</span>
    </div>

</body>
