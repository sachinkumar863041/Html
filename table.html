<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Student Table</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Alice</td>
            <td>20</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Bob</td>
            <td>22</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Charlie</td>
            <td>21</td>
        </tr>
    </table>

</body>
</html>
