<!DOCTYPE html>
<html>
<head>
    <title>Hostel Management</title>
</head>
<body>

    <h1>Hostel Management System</h1>

    <p>Welcome to the Hostel Management Portal.</p>

    <h2>Student Registration</h2>

    <form>
        <label>Student Name:</label><br>
        <input type="text" placeholder="Enter Name"><br><br>

        <label>Room Number:</label><br>
        <input type="number" placeholder="Enter Room No"><br><br>

        <label>Gender:</label><br>
        <select>
            <option>Male</option>
            <option>Female</option>
        </select><br><br>

        <button type="submit">Register</button>
    </form>

    <h2>Hostel Rules</h2>

    <ul>
        <li>Maintain cleanliness.</li>
        <li>No loud noise after 10 PM.</li>
        <li>Visitors are allowed only during visiting hours.</li>
    </ul>

    <hr>

    <footer>
        <p>&copy; 2026 Hostel Management System</p>
    </footer>

</body>
</html>
