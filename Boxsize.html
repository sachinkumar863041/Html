
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Sizing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .box1 {
            width: 300px;
            height: 150px;
            padding: 20px;
            border: 5px solid blue;
            margin: 20px;
            box-sizing: content-box;
            background-color: lightblue;
        }

        .box2 {
            width: 300px;
            height: 150px;
            padding: 20px;
            border: 5px solid green;
            margin: 20px;
            box-sizing: border-box;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h2>CSS Box Sizing</h2>

    <div class="box1">
        Content Box
    </div>

    <div class="box2">
        Border Box
    </div>

</body>
</html>
