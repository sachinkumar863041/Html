<!DOCTYPE html>
<html>
<head>
    <title>CSS Position Property</title>

    <style>
        .container {
            width: 500px;
            height: 400px;
            border: 3px solid black;
            margin: 50px;
        }

        /* 1. Static */
        .static {
            position: static;
            background-color: lightblue;
            padding: 10px;
        }

        /* 2. Relative */
        .relative {
            position: relative;
            left: 30px;
            top: 10px;
            background-color: lightgreen;
            padding: 10px;
        }

        /* 3. Absolute */
        .absolute {
            position: absolute;
            top: 150px;
            left: 250px;
            background-color: orange;
            padding: 10px;
        }

        /* 4. Fixed */
        .fixed {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background-color: red;
            color: white;
            padding: 15px;
        }

        /* 5. Sticky */
        .sticky {
            position: sticky;
            top: 0;
            background-color: purple;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="static">
            Static Position
        </div>

        <div class="relative">
            Relative Position
        </div>

        <div class="absolute">
            Absolute Position
        </div>

    </div>

    <div class="sticky">
        Sticky Position
    </div>

    <div class="fixed">
        Fixed Position
    </div>

</body>
</html>
