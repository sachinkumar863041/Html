<!DOCTYPE html>
<html>
<head>
    <style>
        .box {
            width: 500px;
            height: 200px;
            background-color: blue;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 50px auto;
        }

        @media (max-width: 600px) {
            .box {
                width: 250px;
                background-color: green;
            }
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Hello CSS</h2>
        <p>Resize the screen</p>
    </div>

</body>
</html>
