<!DOCTYPE html>
<html>
<head>
    <title>Travel Destination</title>
    <style>
        body {
            font-family: Arial;
            background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");
            background-size: cover;
            background-position: center;
        }

        .card {
            width: 350px;
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 50px auto;
            border-radius: 15px;
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        h2 {
            color: yellow;
        }

        p {
            color: white;
        }

        button {
            background-color: orange;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Manali</h2>

    <img src="https://images.unsplash.com/photo-1626621341517-bbf3d9990a23" 
         alt="Manali">

    <p>
        Manali is a beautiful hill station famous for mountains,
        snowfall and adventure activities.
    </p>

    <button>Explore Now</button>
</div>

</body>
</html>
