<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
        }

        .card {
            width: 300px;
            background-color: lightyellow;
            text-align: center;
            padding: 20px;
            margin: 50px auto;
            border-radius: 15px;
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        h1 {
            color: darkblue;
        }

        p {
            color: green;
        }

        button {
            background-color: purple;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="card">
    <img src="IMAGE1" alt="Profile Image">

    <h1>Sachin Kumar</h1>

    <p>
        I am a college student interested in web development,
        programming and learning new technologies.
    </p>

    <button>View Profile</button>
</div>

</body>
</html>
