<!DOCTYPE html>
<html>
<head>
    <title>CSS Shadow Properties</title>

    <style>

        /* BOX SHADOW */
        .box {
            width: 250px;
            padding: 30px;
            margin: 30px;
            background-color: lightblue;

            box-shadow: 10px 10px 15px gray;
        }


        /* TEXT SHADOW */
        h1 {
            color: blue;

            text-shadow: 3px 3px 5px gray;
        }


        /* IMAGE SHADOW */
        img {
            width: 300px;
            margin: 30px;

            filter: drop-shadow(10px 10px 10px gray);
        }

    </style>
</head>

<body>

    <h1>Text Shadow Example</h1>

    <div class="box">
        Box Shadow Example
    </div>

    <img src="IMAGE1.jpg" alt="Example Image">

</body>
</html>
